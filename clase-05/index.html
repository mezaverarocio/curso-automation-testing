<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clase 05 - Calculadora Modular</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body> 
    <div id="contenedor-calculadora">
        
        <h1 id="titulo-principal"> Calculadora Modular</h1>
        <p>Esta calculadora permite realizar operaciones básicas como suma, resta, multiplicación y división entre dos números.</p>
        <form id="form-calculadora" action="#" method="post">
            <label for="num1">Número 1:</label>
            <input type="number" id="num1" name="num1" required>
            
            <label for="num2">Número 2:</label>
            <input type="number" id="num2" name="num2" required>

            <input type="radio" id="sumar" name="operacion" value="sumar">
            <label for="sumar" >Sumar</label>
            <input type="radio" id="restar" name="operacion" value="restar">
            <label for="restar">Restar</label>
            <input type="radio" id="multiplicar" name="operacion" value="multiplicar">
            <label for="multiplicar">Multiplicar</label>
            <input type="radio" id="dividir" name="operacion" value="dividir">
            <label for="dividir">Dividir</label>
            
            <button type="button" id="btn-calcular">Calcular</button>
    
        
        </form>
    </div>

</body>
</html>
